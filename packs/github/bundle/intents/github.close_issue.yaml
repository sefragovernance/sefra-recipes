intent: github.close_issue
version: 1
description: Close one open issue as completed or not planned, after a maintainer approves. Refuses pull requests and an issue that is not open. Undone by reopening it.
effect: write
tags: [github, issues]
input_schema:
  type: object
  additionalProperties: false
  required: [issue_number, reason]
  properties:
    issue_number: { type: integer, minimum: 1, maximum: 2147483647 }
    reason:       { type: string, enum: [completed, not_planned] }
output_schema:
  type: object
  additionalProperties: false
  required: [number, state]
  properties:
    number: { type: integer }
    state:  { type: string, const: closed }
facts:
  # GitHub answers with the whole issue. The schema is closed, so a field GitHub
  # adds later stops the intent until it is declared here. Only number, state,
  # and label names stay readable; every other field is replaced by a keyed hash
  # before the decision is stored, including the author, title and body.
  issue:
    connector: github
    method: GET
    path: "/issues/${input.issue_number}"
    response_schema:
      type: object
      additionalProperties: false
      required: [number, state, labels]
      properties:
        number: { type: integer }
        state:  { type: string }
        labels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:        { type: string, maxLength: 100 }
              id:          { x-sefra-sensitive: true }
              node_id:     { x-sefra-sensitive: true }
              url:         { x-sefra-sensitive: true }
              color:       { x-sefra-sensitive: true }
              default:     { x-sefra-sensitive: true }
              description: { x-sefra-sensitive: true }
              archived_at: { x-sefra-sensitive: true }
              archived_by: { x-sefra-sensitive: true }
        url: { x-sefra-sensitive: true }
        repository_url: { x-sefra-sensitive: true }
        labels_url: { x-sefra-sensitive: true }
        comments_url: { x-sefra-sensitive: true }
        events_url: { x-sefra-sensitive: true }
        html_url: { x-sefra-sensitive: true }
        timeline_url: { x-sefra-sensitive: true }
        id: { x-sefra-sensitive: true }
        node_id: { x-sefra-sensitive: true }
        title: { x-sefra-sensitive: true }
        body: { x-sefra-sensitive: true }
        user: { x-sefra-sensitive: true }
        assignee: { x-sefra-sensitive: true }
        assignees: { x-sefra-sensitive: true }
        milestone: { x-sefra-sensitive: true }
        locked: { x-sefra-sensitive: true }
        active_lock_reason: { x-sefra-sensitive: true }
        comments: { x-sefra-sensitive: true }
        created_at: { x-sefra-sensitive: true }
        updated_at: { x-sefra-sensitive: true }
        closed_at: { x-sefra-sensitive: true }
        closed_by: { x-sefra-sensitive: true }
        author_association: { x-sefra-sensitive: true }
        issue_field_values: { x-sefra-sensitive: true }
        type: { x-sefra-sensitive: true }
        sub_issues_summary: { x-sefra-sensitive: true }
        issue_dependencies_summary: { x-sefra-sensitive: true }
        reactions: { x-sefra-sensitive: true }
        performed_via_github_app: { x-sefra-sensitive: true }
        state_reason: { x-sefra-sensitive: true }
        pinned_comment: { x-sefra-sensitive: true }
        pull_request: { x-sefra-sensitive: true }
        draft: { x-sefra-sensitive: true }
        body_html: { x-sefra-sensitive: true }
        body_text: { x-sefra-sensitive: true }
        parent_issue_url: { x-sefra-sensitive: true }
        repository: { x-sefra-sensitive: true }
        status: { x-sefra-sensitive: true }
execute:
  connector: github
  method: PATCH
  path: "/issues/${input.issue_number}"
  body: { state: closed, state_reason: "${input.reason}" }
  # Closing a closed issue changes nothing, so repeating an unclear attempt is safe.
  idempotency: { mode: natural }
  success: [200]
  output: { number: "${response.body.number}", state: "${response.body.state}" }
# The policy refuses an issue that is not open, so this reopens only what this
# step closed. No already_undone: an issue that is gone cannot be reopened, and
# that is for an operator to see.
compensate:
  connector: github
  method: PATCH
  path: "/issues/${input.issue_number}"
  body: { state: open }
  idempotency: { mode: natural }
  success: [200]
  success_when: { "/state": open }
summary_template: "Close issue #${input.issue_number} as ${input.reason}"
