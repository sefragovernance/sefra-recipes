# The Stripe API, test mode only. The connector sends nothing with a key that
# is not a test key (secret_prefixes). That is the guard for refunds, whose
# answers carry no livemode field. An answer that says it is live, or a refund
# answered as failed, is not trusted (fail_closed_on) and reaches an operator.
# Going live is a deliberate edit of these settings.
connectors:
  stripe:
    type: http
    base_url: https://api.stripe.com
    auth:
      type: bearer
      secret: stripe_secret_key
      secret_prefixes: [sk_test_, rk_test_]
    body_encoding: form
    fail_closed_on: { "/livemode": true, "/status": failed }
    timeout_ms: 30000
    max_concurrency: 4
